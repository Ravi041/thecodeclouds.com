<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="MCP gateway pattern: agents connect to one gateway that authenticates, authorizes, audits and routes calls to MCP servers">
<title>MCP gateway pattern: agents connect to one gateway that authenticates, authorizes, audits and routes calls to MCP servers</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker>
</defs>
<rect width="1200" height="640" fill="#ffffff"/>
<g style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">
<text x="600" y="50" font-size="30" fill="#0f172a" font-weight="700" text-anchor="middle">The MCP gateway pattern</text>
<text x="600" y="82" font-size="18" fill="#475569" font-weight="400" text-anchor="middle">One governed entry point between agents and the MCP servers they use</text>
<rect x="40" y="165" width="200" height="70" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="140" y="206" font-size="18" fill="#0f172a" font-weight="600" text-anchor="middle">Coding agent</text>
<line x1="242" y1="200" x2="368" y2="270" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#ai)"/>
<rect x="40" y="305" width="200" height="70" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="140" y="346" font-size="18" fill="#0f172a" font-weight="600" text-anchor="middle">Support agent</text>
<line x1="242" y1="340" x2="368" y2="330" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#ai)"/>
<rect x="40" y="445" width="200" height="70" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="140" y="486" font-size="18" fill="#0f172a" font-weight="600" text-anchor="middle">Data agent</text>
<line x1="242" y1="480" x2="368" y2="390" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#ai)"/>
<rect x="370" y="130" width="460" height="400" rx="20" fill="#fff" stroke="#0d9488" stroke-width="3"/>
<text x="600" y="170" font-size="24" fill="#0d9488" font-weight="800" text-anchor="middle">MCP gateway</text>
<rect x="400" y="200" width="400" height="52" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="420" y="223" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">Authenticate</text>
<text x="420" y="243" font-size="14" fill="#475569" font-weight="400" text-anchor="start">OAuth 2.1 token, audience per server</text>
<rect x="400" y="264" width="400" height="52" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="420" y="287" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">Authorize</text>
<text x="420" y="307" font-size="14" fill="#475569" font-weight="400" text-anchor="start">policy per caller and tool</text>
<rect x="400" y="328" width="400" height="52" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="420" y="351" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">Protect</text>
<text x="420" y="371" font-size="14" fill="#475569" font-weight="400" text-anchor="start">strip caller credentials, egress limits</text>
<rect x="400" y="392" width="400" height="52" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="420" y="415" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">Audit + observe</text>
<text x="420" y="435" font-size="14" fill="#475569" font-weight="400" text-anchor="start">who called what, metrics, alerts</text>
<rect x="400" y="456" width="400" height="52" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="420" y="479" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">Route</text>
<text x="420" y="499" font-size="14" fill="#475569" font-weight="400" text-anchor="start">to the right server and version</text>
<rect x="960" y="165" width="200" height="70" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="1060" y="206" font-size="18" fill="#0f172a" font-weight="600" text-anchor="middle">Tickets server</text>
<line x1="832" y1="270" x2="956" y2="200" stroke="#0d9488" stroke-width="2.2" marker-end="url(#at)"/>
<rect x="960" y="305" width="200" height="70" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="1060" y="346" font-size="18" fill="#0f172a" font-weight="600" text-anchor="middle">Search server</text>
<line x1="832" y1="330" x2="956" y2="340" stroke="#0d9488" stroke-width="2.2" marker-end="url(#at)"/>
<rect x="960" y="445" width="200" height="70" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="1060" y="486" font-size="18" fill="#0f172a" font-weight="600" text-anchor="middle">Database server</text>
<line x1="832" y1="390" x2="956" y2="480" stroke="#0d9488" stroke-width="2.2" marker-end="url(#at)"/>
<rect x="310" y="560" width="580" height="50" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="600" y="591" font-size="15" fill="#d97706" font-weight="600" text-anchor="middle">Control plane: which servers exist, who owns them, are they healthy</text>
<line x1="600" y1="558" x2="600" y2="534" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4"/>
</g></svg>

<text x="20" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#202124" text-anchor="start">Scenario: an online shop growing from 5 to 50 engineers</text>
<text x="20" y="59" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5F6368" text-anchor="start">Architecture follows the team. Each stage solves the problem the previous one created, not one you might have later.</text>
<text x="36" y="125" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#202124" text-anchor="start">One team, one Rails/Django/Spring app</text>
<text x="255" y="179" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">One deployable</text>
<text x="255" y="191" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">deploys 10x a day, no waiting</text>
<text x="255" y="261" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">One database</text>
<text x="255" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">joins and transactions are free</text>
<text x="255" y="343" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Folders, not modules</text>
<text x="255" y="355" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">fine while everyone knows the code</text>
<text x="255" y="439.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">shop-app</text>
<text x="255" y="526" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#202124" text-anchor="middle">shop DB</text>
<text x="60" y="635" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Pain that ends this stage:</text>
<text x="60" y="650" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">merge conflicts in checkout code,</text>
<text x="60" y="665" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">a 25 min test suite, one person</text>
<text x="60" y="680" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">who "owns" payments in their head.</text>
<text x="531" y="125" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#202124" text-anchor="start">Three teams, same deployable, real modules</text>
<text x="750" y="179" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Modules with interfaces</text>
<text x="750" y="191" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">Discover · Buy · Fulfil</text>
<text x="750" y="261" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Schema per module</text>
<text x="750" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">no cross-module joins</text>
<text x="750" y="343" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">CODEOWNERS + CI rules</text>
<text x="750" y="355" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">boundary checks fail the build</text>
<text x="625" y="450.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Discover</text>
<text x="750" y="450.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Buy</text>
<text x="875" y="450.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Fulfil</text>
<text x="625" y="541" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#202124" text-anchor="middle">catalog.*</text>
<text x="750" y="541" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#202124" text-anchor="middle">orders.*</text>
<text x="875" y="541" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#202124" text-anchor="middle">stock.*</text>
<text x="555" y="635" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Pain that ends this stage:</text>
<text x="555" y="650" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">search needs 40 nodes at 9 PM sale</text>
<text x="555" y="665" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">time, the rest needs 6; PCI scope</text>
<text x="555" y="680" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">covers the whole app; deploy</text>
<text x="555" y="695" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">queue reaches 2 hours.</text>
<text x="1026" y="125" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#202124" text-anchor="start">Seven teams, core + extracted services</text>
<text x="1245" y="179" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Modular core</text>
<text x="1245" y="191" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">catalog, cart, checkout, orders</text>
<text x="1245" y="261" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Extracted services</text>
<text x="1245" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">search, payments, inventory</text>
<text x="1245" y="343" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Event bus + gateway</text>
<text x="1245" y="355" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">strangler routing per path</text>
<text x="1245" y="418.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">gateway</text>
<text x="1115" y="482.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">core (modular)</text>
<text x="1245" y="482.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">search</text>
<text x="1329" y="482.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">payments</text>
<text x="1413" y="482.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">inventory</text>
<text x="1245" y="544.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">events</text>
<text x="1050" y="635" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Extract only where there is a</text>
<text x="1050" y="650" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">reason: different scale, different</text>
<text x="1050" y="665" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">compliance, or a team blocked</text>
<text x="1050" y="680" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">by the release train. Everything</text>
<text x="1050" y="695" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">else stays in the core.</text></svg>
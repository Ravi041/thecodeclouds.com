<text x="20" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#202124" text-anchor="start">Same e-commerce shop, two shapes: a modular monolith and microservices</text>
<text x="20" y="59" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5F6368" text-anchor="start">Identical business modules. What changes is where the boundaries are enforced: in code, or over the network.</text>
<text x="157.5" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Catalog</text>
<text x="157.5" y="217" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">public interface only</text>
<text x="372.5" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Search</text>
<text x="372.5" y="217" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">public interface only</text>
<text x="587.5" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Customers</text>
<text x="587.5" y="217" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">public interface only</text>
<text x="157.5" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Cart</text>
<text x="157.5" y="312" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">public interface only</text>
<text x="372.5" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Checkout</text>
<text x="372.5" y="312" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">public interface only</text>
<text x="587.5" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Pricing &amp; promos</text>
<text x="587.5" y="312" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">public interface only</text>
<text x="157.5" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Inventory</text>
<text x="157.5" y="407" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">public interface only</text>
<text x="372.5" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Orders</text>
<text x="372.5" y="407" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">public interface only</text>
<text x="587.5" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Payments</text>
<text x="587.5" y="407" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">public interface only</text>
<text x="380" y="451" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1A73E8" text-anchor="middle">in-process calls: microseconds, one transaction if you need it</text>
<text x="375" y="526.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#202124" text-anchor="middle">One PostgreSQL cluster</text>
<text x="375" y="538.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">schema per module: catalog, cart, orders, payments, inventory ...</text>
<text x="50" y="620" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Modules talk through their public interface, never through another module's tables.</text>
<text x="50" y="635" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Boundaries are checked in CI (import rules, ArchUnit, Packwerk, Spring Modulith).</text>
<text x="50" y="650" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Each module has an owning team in CODEOWNERS and its own folder of tests.</text>
<text x="50" y="665" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Events still flow out through an outbox table, so search and analytics stay async.</text>
<text x="40" y="747" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A73E8" text-anchor="start">Good fit: 1 to 4 teams, one release train, strong consistency in checkout</text>
<text x="1125" y="151" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">API gateway</text>
<text x="1125" y="163" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">auth, rate limits, routing</text>
<text x="862.5" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Catalog</text>
<text x="862.5" y="255" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">PostgreSQL</text>
<text x="1037.5" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Search</text>
<text x="1037.5" y="255" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">OpenSearch</text>
<text x="1212.5" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Cart</text>
<text x="1212.5" y="255" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">Redis</text>
<text x="1387.5" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Checkout</text>
<text x="1387.5" y="255" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">PostgreSQL</text>
<text x="862.5" y="388" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Orders</text>
<text x="862.5" y="400" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">PostgreSQL</text>
<text x="1037.5" y="388" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Pricing</text>
<text x="1037.5" y="400" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">PostgreSQL + cache</text>
<text x="1212.5" y="388" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Inventory</text>
<text x="1212.5" y="400" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">PostgreSQL</text>
<text x="1387.5" y="388" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Payments</text>
<text x="1387.5" y="400" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">PostgreSQL + PSP</text>
<text x="1040" y="311" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D93025" text-anchor="start">sync HTTP/gRPC: milliseconds, can time out, needs retries</text>
<text x="1125" y="489.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Event bus (Kafka, Pub/Sub, Service Bus, EventBridge)</text>
<text x="1125" y="523" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#E8710A" text-anchor="middle">OrderPlaced · PaymentCaptured · StockReserved · ProductUpdated</text>
<text x="800" y="620" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Each service: its own deploys, dashboards, alerts, on-call rota and schema migrations.</text>
<text x="800" y="635" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">No cross-service transactions: sagas, outbox and idempotent consumers instead.</text>
<text x="800" y="650" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Contract tests or schema registry between teams, versioned APIs and events.</text>
<text x="800" y="665" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Platform needs: service discovery, mTLS, tracing, per-service CI/CD.</text>
<text x="790" y="747" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#188038" text-anchor="start">Good fit: 6+ teams, parts with very different scale or compliance needs</text></svg>
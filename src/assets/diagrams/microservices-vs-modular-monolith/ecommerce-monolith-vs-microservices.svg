<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" width="1500" height="800" role="img"><title>1. Same shop, two shapes</title><defs><marker id="a1A73E8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1A73E8"/></marker><marker id="a7B3FE4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7B3FE4"/></marker><marker id="aD93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D93025"/></marker><marker id="aE8710A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E8710A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="20" y="80" width="710" height="700" rx="8" fill="#FBFDFF" stroke="#1A73E8"/>
<text x="28" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A73E8" text-anchor="start">Modular monolith</text>
<text x="28" y="108" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="start">one repo, one pipeline, one deployable</text>
<rect x="40" y="130" width="670" height="330" rx="8" fill="#FFFFFF" stroke="#1A73E8"/>
<text x="48" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A73E8" text-anchor="start">shop-app (one process, scaled to N identical replicas)</text>
<rect x="40" y="585" width="670" height="94" rx="8" fill="#E8F0FE" stroke="#1A73E8"/>
<text x="48" y="601" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A73E8" text-anchor="start">Rules that keep it modular</text>
<rect x="770" y="80" width="710" height="700" rx="8" fill="#FBFEFC" stroke="#188038"/>
<text x="778" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#188038" text-anchor="start">Microservices</text>
<text x="778" y="108" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="start">one repo or folder, pipeline, on-call and datastore per service</text>
<rect x="790" y="585" width="670" height="94" rx="8" fill="#E6F4EA" stroke="#188038"/>
<text x="798" y="601" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#188038" text-anchor="start">What you sign up for</text>

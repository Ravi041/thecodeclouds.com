<text x="20" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#202124" text-anchor="start">Where to cut: bounded contexts for an online shop, with the data each one owns</text>
<text x="20" y="59" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5F6368" text-anchor="start">Solid arrows are synchronous calls on the checkout path. Dashed arrows are events. Every context owns its tables; nobody else writes them.</text>
<text x="140" y="204" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Catalog</text>
<text x="140" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">Product: title, images, attributes</text>
<text x="360" y="204" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Search</text>
<text x="360" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">index rebuilt from events</text>
<text x="640" y="204" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Pricing</text>
<text x="640" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">price lists, currency</text>
<text x="860" y="204" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Promotions</text>
<text x="860" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">coupons, rules, budgets</text>
<text x="1140" y="204" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Identity</text>
<text x="1140" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">login, tokens, MFA</text>
<text x="1360" y="204" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Customer</text>
<text x="1360" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">addresses, preferences</text>
<text x="150" y="504" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Cart</text>
<text x="150" y="516" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">lines, expiring in 30 days</text>
<text x="370" y="504" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Orders</text>
<text x="370" y="516" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">OrderLine with price snapshot</text>
<text x="590" y="504" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Checkout</text>
<text x="590" y="516" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">orchestrates the saga</text>
<text x="930" y="504" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Payments</text>
<text x="930" y="516" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">authorise, capture, refund</text>
<text x="1230" y="504" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Inventory</text>
<text x="1230" y="516" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">SKU stock, reservations</text>
<text x="1390" y="504" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Shipping</text>
<text x="1390" y="516" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">labels, carriers, tracking</text>
<text x="300" y="439" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1A73E8" text-anchor="start">read cart</text>
<text x="648" y="351" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1A73E8" text-anchor="start">quote price</text>
<text x="735" y="499" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1A73E8" text-anchor="start">authorise</text>
<text x="800" y="653" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1A73E8" text-anchor="start">reserve stock (TTL 15 min)</text>
<text x="240" y="161" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#E8710A" text-anchor="start">ProductUpdated</text>
<text x="340" y="735" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#E8710A" text-anchor="start">OrderPlaced  →  Shipping, Customer (emails), Analytics</text>
<text x="790" y="615" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#E8710A" text-anchor="start">PaymentCaptured</text>
<text x="30" y="795" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Catalog Product = description and images. Inventory SKU = stock per warehouse.</text>
<text x="30" y="810" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Order line = what the customer saw and paid, frozen at checkout. Three models, three owners.</text>
<text x="30" y="825" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Sharing one Product table across all three is how a distributed monolith starts.</text>
<text x="770" y="795" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Can this team change its tables and deploy without asking anyone?</text>
<text x="770" y="810" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Does a single user action need more than one or two sync hops?</text>
<text x="770" y="825" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">If the answers are "no" and "yes", the line is in the wrong place.</text></svg>
<text x="20" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#202124" text-anchor="start">API gateway and Backend-for-Frontend: who does what on the request path</text>
<text x="20" y="59" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5F6368" text-anchor="start">The gateway owns cross-cutting concerns. Each BFF is owned by the team that owns the screen. Neither holds business rules.</text>
<text x="120" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Web storefront</text>
<text x="120" y="181" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">Next.js, SSR</text>
<text x="120" y="289" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">iOS / Android app</text>
<text x="120" y="301" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">3 versions in the wild</text>
<text x="120" y="409" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Marketplace partners</text>
<text x="120" y="421" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">server to server</text>
<text x="120" y="529" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Back-office</text>
<text x="120" y="541" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">staff, SSO</text>
<text x="345" y="318" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">CDN + WAF</text>
<text x="345" y="330" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">cache, bot rules, TLS</text>
<text x="575" y="315.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">API gateway</text>
<text x="575" y="327.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle"></text>
<text x="575" y="339.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">JWT / API-key auth</text>
<text x="575" y="351.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">rate limits per client</text>
<text x="575" y="363.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">routing by path + version</text>
<text x="575" y="375.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">request ID, access logs</text>
<text x="575" y="387.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">no aggregation</text>
<text x="300" y="546" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5F6368" text-anchor="start">internal only</text>
<text x="850" y="173" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Web BFF</text>
<text x="850" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">owned by web team</text>
<text x="850" y="286.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Mobile BFF</text>
<text x="850" y="298.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">owned by app team,</text>
<text x="850" y="310.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">keeps old app versions working</text>
<text x="850" y="406.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Partner API</text>
<text x="850" y="418.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">public, versioned v1/v2,</text>
<text x="850" y="430.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">quotas, webhooks</text>
<text x="850" y="533" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Admin BFF</text>
<text x="850" y="545" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">role checks, audit</text>
<text x="1165" y="147.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Catalog</text>
<text x="1165" y="209.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Pricing</text>
<text x="1165" y="271.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Inventory</text>
<text x="1165" y="333.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Reviews</text>
<text x="1165" y="395.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Recommendations</text>
<text x="1165" y="457.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Cart / Checkout</text>
<text x="1165" y="519.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Orders</text>
<circle cx="41" cy="121" r="11" fill="#202124"/><text x="41" y="125.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="651" cy="136" r="11" fill="#7B3FE4"/><text x="651" y="140.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="1023" cy="266" r="11" fill="#1A73E8"/><text x="1023" y="270.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1305" y="155" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Product page in the app:</text>
<text x="1305" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">one call to the Mobile BFF,</text>
<text x="1305" y="185" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">which calls 5 services in</text>
<text x="1305" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">parallel. Budget 300 ms.</text>
<text x="1305" y="215" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Catalog + price + stock are</text>
<text x="1305" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">required. Reviews and recos</text>
<text x="1305" y="245" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">are optional: if they miss the</text>
<text x="1305" y="260" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">budget, return the page</text>
<text x="1305" y="275" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">without them.</text>
<text x="1305" y="395" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Business rules in the gateway</text>
<text x="1305" y="410" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">(discount logic in a Lua plugin).</text>
<text x="1305" y="425" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">One shared BFF for every</text>
<text x="1305" y="440" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">client: it becomes a new</text>
<text x="1305" y="455" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">monolith with no owner.</text>
<text x="1305" y="470" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">BFFs calling each other.</text>
<text x="30" y="652" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124" text-anchor="start">1  Every client enters through the same edge and gateway.   2  Gateway authenticates, limits and routes; it never joins data.   3  The BFF shapes data for one client and owns its timeouts.</text>
<text x="96" y="722" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Client traffic through CDN/WAF</text>
<text x="96" y="743" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Gateway to BFF</text>
<text x="96" y="764" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">BFF to service (only the Mobile BFF fan-out drawn)</text></svg>
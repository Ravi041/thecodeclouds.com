<text x="20" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#202124" text-anchor="start">Scenario: how one slow fraud check took the whole shop down, and the fixed design</text>
<text x="20" y="59" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5F6368" text-anchor="start">Sale night, 20:00. Nothing crashed. Everything waited.</text>
<text x="150" y="159" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Shoppers</text>
<text x="150" y="171" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">9,000 checkouts/min</text>
<text x="440" y="159" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">API gateway</text>
<text x="440" y="171" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">one shared upstream pool</text>
<text x="730" y="159" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Checkout</text>
<text x="730" y="171" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">200 worker threads</text>
<text x="1020" y="159" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Payments</text>
<text x="1020" y="171" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">timeout: 30 s (library default)</text>
<text x="1310" y="159" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Fraud scoring</text>
<text x="1310" y="171" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">vendor API, p99 0.4 s → 28 s</text>
<text x="588" y="151" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D93025" text-anchor="middle">retry x3</text>
<text x="878" y="151" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D93025" text-anchor="middle">retry x3</text>
<text x="1168" y="151" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D93025" text-anchor="middle">retry x3</text>
<text x="440" y="273" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Product pages, search, cart</text>
<text x="440" y="285" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">share the gateway pool</text>
<text x="640" y="237" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124" text-anchor="start">20:02  Fraud vendor slows down. Payments threads sit waiting on 30 s calls.</text>
<text x="640" y="259" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124" text-anchor="start">20:04  Checkout's 200 threads are all blocked on Payments. New checkouts queue, then time out.</text>
<text x="640" y="281" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124" text-anchor="start">20:05  Gateway, Checkout and Payments each retry 3 times: 3 x 3 x 3 = 27 requests per click.</text>
<text x="640" y="303" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124" text-anchor="start">20:07  Gateway upstream pool is full of checkout requests. Product pages and search start failing too.</text>
<text x="640" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#D93025" text-anchor="start">20:31  Rollback does nothing (no code changed). Fraud check disabled by hand; 29 minutes of lost sales.</text>
<text x="40" y="418" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#D93025" text-anchor="start">Root cause: not the vendor. Unbounded waiting, multiplied retries and no isolation between checkout and browsing.</text>
<text x="115" y="569.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Shoppers</text>
<text x="340" y="563" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">API gateway</text>
<text x="340" y="575" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">per-route pools + load shedding</text>
<text x="625" y="556.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Checkout</text>
<text x="625" y="568.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">deadline 2 s end to end</text>
<text x="625" y="580.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">bulkhead: pool per dependency</text>
<text x="930" y="563" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Payments</text>
<text x="930" y="575" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">authorise, timeout 800 ms</text>
<text x="1215" y="538" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Circuit breaker</text>
<text x="1215" y="550" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">opens at 20% errors / slow calls</text>
<text x="1215" y="623" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Fraud scoring</text>
<text x="1215" y="635" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">timeout 300 ms</text>
<text x="1215" y="706" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Fallback: rules-based score,</text>
<text x="1215" y="718" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">hold orders &gt; $300 for review</text>
<text x="1365" y="621" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#E8710A" text-anchor="start">open</text>
<text x="690" y="674.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">order-placed queue (outbox)</text>
<text x="690" y="761" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Capture + emails + fulfilment workers</text>
<text x="690" y="773" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#545B64" text-anchor="middle">retry with backoff, idempotency keys</text>
<text x="40" y="651" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#202124" text-anchor="start">1  Retry in one place only (the client or gateway), with jitter and a retry budget of 10%.</text>
<text x="40" y="675" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#202124" text-anchor="start">2  Every call carries the remaining deadline; nothing waits longer than the user will.</text>
<text x="40" y="699" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#202124" text-anchor="start">3  Separate pools per downstream: Payments being slow cannot use Search's threads.</text>
<text x="40" y="723" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#202124" text-anchor="start">4  Accept the order, then capture, email and ship from a queue. User sees "Order received".</text>
<text x="40" y="843" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#188038" text-anchor="start">Result in the next sale: fraud vendor slowed again for 11 minutes, breaker opened, 0 checkout errors, 214 orders held for review.</text></svg>
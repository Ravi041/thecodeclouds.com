<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img"><title>5. Checkout outage cascade</title><defs><marker id="a188038" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#188038"/></marker><marker id="aD93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D93025"/></marker><marker id="aE8710A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E8710A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="20" y="80" width="1460" height="370" rx="8" fill="#FFFBFA" stroke="#D93025"/>
<text x="28" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#D93025" text-anchor="start">Before: synchronous chain, default timeouts, retries at every hop, one shared pool</text>
<rect x="20" y="480" width="1460" height="400" rx="8" fill="#FBFEFC" stroke="#188038"/>
<text x="28" y="496" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#188038" text-anchor="start">After: deadlines, isolation and an async tail. A slow dependency degrades one feature, not the shop.</text>

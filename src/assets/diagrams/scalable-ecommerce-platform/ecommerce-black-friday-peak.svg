<path d="M257 280 L283 280" fill="none" stroke="#5F6368" stroke-width="3" marker-end="url(#a5F6368)"/>
<path d="M40 94 L40 466" fill="none" stroke="#5F6368" stroke-width="5"/>
<text x="20" y="32" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#232F3E" text-anchor="start">Black Friday, 00:00 to 00:15: where 180,000 requests per second go</text>
<text x="20" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F6368" text-anchor="start">Each layer exists to make the next one smaller. Numbers are the worked example from the article.</text>
<text x="54" y="118" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#5F6368" text-anchor="start">Shoppers</text>
<text x="54" y="141" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">2.4 M sessions in the</text>
<text x="54" y="156" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">first hour, 600 k live</text>
<text x="54" y="452" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#202124" text-anchor="start">180 k req/s</text>
<text x="54" y="277" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5F6368" text-anchor="start">baseline at 23:58 was</text>
<text x="54" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5F6368" text-anchor="start">9 k req/s</text>
<text x="299" y="138.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#D93025" text-anchor="start">CDN + edge cache</text>
<text x="299" y="161.9" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">92 % of requests end here:</text>
<text x="299" y="176.9" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">images, JS, product pages</text>
<text x="299" y="431.1" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#202124" text-anchor="start">14.4 k req/s</text>
<text x="299" y="277" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D93025" text-anchor="start">absorbs 165 k req/s</text>
<text x="299" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D93025" text-anchor="start">at 0 origin cost</text>
<text x="544" y="159.8" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#D93025" text-anchor="start">Waiting room</text>
<text x="544" y="182.8" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">admits 9,000 new</text>
<text x="544" y="197.8" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">sessions per minute</text>
<text x="544" y="410.2" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#202124" text-anchor="start">11 k req/s</text>
<text x="544" y="277" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D93025" text-anchor="start">peak queue 140 k people</text>
<text x="544" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D93025" text-anchor="start">longest wait 4 min</text>
<text x="789" y="180.7" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#E37400" text-anchor="start">API gateway</text>
<text x="789" y="203.7" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">rate limit 20 req/s</text>
<text x="789" y="218.7" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">per session, bots blocked</text>
<text x="789" y="389.3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#202124" text-anchor="start">10.2 k req/s</text>
<text x="789" y="277" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#E37400" text-anchor="start">rejects ~800 req/s</text>
<text x="789" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#E37400" text-anchor="start">with 429</text>
<text x="1034" y="201.6" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A73E8" text-anchor="start">Browse services</text>
<text x="1034" y="224.6" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">catalog, search, price</text>
<text x="1034" y="239.6" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">85 % hit app cache</text>
<text x="1034" y="368.4" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#202124" text-anchor="start">1.4 k q/s to DBs</text>
<text x="1034" y="277" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1A73E8" text-anchor="start">cache absorbs</text>
<text x="1034" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1A73E8" text-anchor="start">7.7 k req/s</text>
<text x="1279" y="222.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E8E3E" text-anchor="start">Buy path</text>
<text x="1279" y="245.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">cart 1,100 writes/s</text>
<text x="1279" y="260.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">checkout 55 orders/s</text>
<text x="1279" y="347.5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#202124" text-anchor="start">55 payments/s</text>
<text x="1279" y="277" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1E8E3E" text-anchor="start">198 k orders</text>
<text x="1279" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1E8E3E" text-anchor="start">in the first hour</text>
<text x="56" y="523" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A73E8" text-anchor="start">Capacity plan for the night</text>
<text x="56" y="552" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A73E8" text-anchor="start">T-30 days</text>
<text x="150" y="552" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">load test at 1.5x forecast (270 k req/s at the edge)</text>
<text x="56" y="582" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A73E8" text-anchor="start">T-7 days</text>
<text x="150" y="582" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">change freeze on the buy path, kill switches tested</text>
<text x="56" y="612" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A73E8" text-anchor="start">T-2 h</text>
<text x="150" y="612" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">pre-scale: checkout 12 → 60 pods, DB read replicas 2 → 6</text>
<text x="56" y="642" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A73E8" text-anchor="start">T-15 min</text>
<text x="150" y="642" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">waiting room on, recommendations on cached fallback</text>
<text x="56" y="672" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A73E8" text-anchor="start">T+0</text>
<text x="150" y="672" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">watch orders/min and payment success rate, not CPU</text>
<text x="56" y="702" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A73E8" text-anchor="start">T+3 h</text>
<text x="150" y="702" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">scale down in 25 % steps; room off after 10 min of empty queue</text>
<text x="776" y="523" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#E37400" text-anchor="start">Why not just autoscale?</text>
<text x="776" y="552" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">Traffic went from 9 k to 180 k req/s in 90 seconds.</text>
<text x="776" y="568" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">A new pod takes ~45 s to be ready, a new node ~3 min,</text>
<text x="776" y="584" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">a new database read replica 10 to 20 min.</text>
<text x="776" y="600" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">Autoscaling reacts to load you already have. For a peak you know</text>
<text x="776" y="616" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">is coming, scale before it and let autoscaling handle only the</text>
<text x="776" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">surprise on top. The waiting room covers the rest:</text>
<text x="776" y="648" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">a 4 minute queue beats a 40 minute outage.</text></svg>
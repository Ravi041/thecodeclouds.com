<text x="538" y="147.8" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C4043" text-anchor="start"></text>
<rect x="775" y="152.7" width="215" height="254.6" rx="8" fill="#FFFFFF" stroke="#E37400"/>
<text x="783" y="168.7" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C4043" text-anchor="start"></text>
<rect x="1020" y="173.6" width="215" height="212.8" rx="8" fill="#FFFFFF" stroke="#1A73E8"/>
<text x="1028" y="189.6" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C4043" text-anchor="start"></text>
<rect x="1265" y="194.5" width="215" height="171" rx="8" fill="#FFFFFF" stroke="#1E8E3E"/>
<text x="1273" y="210.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C4043" text-anchor="start"></text>
<rect x="40" y="500" width="700" height="230" rx="8" fill="#F1F6FE" stroke="#1A73E8"/>
<text x="48" y="516" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C4043" text-anchor="start"></text>
<rect x="760" y="500" width="700" height="230" rx="8" fill="#FEF7E0" stroke="#E37400"/>
<text x="768" y="516" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C4043" text-anchor="start"></text>
<path d="M1265 198.5 L1265 361.5" fill="none" stroke="#1E8E3E" stroke-width="5"/>
<path d="M1237 280 L1263 280" fill="none" stroke="#5F6368" stroke-width="3" marker-end="url(#a5F6368)"/>
<path d="M1020 177.6 L1020 382.4" fill="none" stroke="#1A73E8" stroke-width="5"/>
<path d="M992 280 L1018 280" fill="none" stroke="#5F6368" stroke-width="3" marker-end="url(#a5F6368)"/>

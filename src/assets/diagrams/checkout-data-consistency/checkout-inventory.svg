<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img"><title>4. Inventory reservation without oversell</title><defs><marker id="a1A73E8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1A73E8"/></marker><marker id="a1E8E3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E8E3E"/></marker><marker id="a5F6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F6368"/></marker><marker id="aBDC1C6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#BDC1C6"/></marker><marker id="aD93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D93025"/></marker><marker id="aE8710A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E8710A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="20" y="80" width="700" height="440" rx="8" fill="#FFFBFA" stroke="#D93025"/>
<text x="28" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#D93025" text-anchor="start">Wrong: read, check in code, then write</text>
<rect x="60" y="115" width="160" height="46" rx="8" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/>
<rect x="290" y="115" width="160" height="46" rx="8" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.5"/>
<rect x="520" y="115" width="160" height="46" rx="8" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/>
<rect x="70" y="455" width="600" height="56" rx="8" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/>
<rect x="780" y="80" width="700" height="440" rx="8" fill="#FAFFFB" stroke="#1E8E3E"/>
<text x="788" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E8E3E" text-anchor="start">Right: let the database do the check, atomically</text>
<rect x="820" y="115" width="160" height="46" rx="8" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/>
<rect x="1050" y="115" width="160" height="46" rx="8" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.5"/>
<rect x="1280" y="115" width="160" height="46" rx="8" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/>
<rect x="800" y="380" width="660" height="132" rx="8" fill="#FFFFFF" stroke="#1E8E3E"/>
<text x="808" y="396" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C4043" text-anchor="start"></text>
<rect x="20" y="550" width="1460" height="320" rx="8" fill="#FFFFFF" stroke="#1A73E8"/>
<text x="28" y="566" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A73E8" text-anchor="start">Reservation lifecycle</text>
<rect x="50" y="650" width="170" height="60" rx="8" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/>
<rect x="330" y="650" width="220" height="60" rx="8" fill="#FEF1E3" stroke="#E8710A" stroke-width="1.5"/>
<rect x="700" y="600" width="260" height="60" rx="8" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.5"/>
<rect x="1080" y="600" width="240" height="60" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
<rect x="700" y="700" width="260" height="56" rx="8" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/>
<rect x="700" y="790" width="260" height="56" rx="8" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/>
<path d="M960 818 L1000 818" fill="none" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M960 728 L1000 728 L1000 855 L100 855 L100 710" fill="none" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#a5F6368)"/>
<path d="M440 710 L440 818 L700 818" fill="none" stroke="#D93025" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aD93025)"/>
<path d="M550 692 L700 728" fill="none" stroke="#D93025" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aD93025)"/>

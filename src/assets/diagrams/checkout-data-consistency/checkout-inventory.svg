<path d="M600 161 L600 445" fill="none" stroke="#BDC1C6" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M370 161 L370 445" fill="none" stroke="#BDC1C6" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M140 161 L140 445" fill="none" stroke="#BDC1C6" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="20" y="34" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#232F3E" text-anchor="start">Scenario: one unit left, two shoppers press Pay 40 ms apart</text>
<text x="20" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F6368" text-anchor="start">Read-then-write lets both win. One conditional UPDATE lets exactly one win, and a reservation with an expiry gives the stock back if checkout dies.</text>
<text x="140" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Shopper A</text>
<text x="370" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">stock row sku-123</text>
<text x="600" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Shopper B</text>
<rect x="190.4" y="173" width="129.2" height="18" fill="#FFFFFF" rx="3"/>
<text x="255" y="185" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1A73E8" text-anchor="middle">SELECT available → 1</text>
<rect x="420.4" y="218" width="129.2" height="18" fill="#FFFFFF" rx="3"/>
<text x="485" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1A73E8" text-anchor="middle">SELECT available → 1</text>
<rect x="190.4" y="273" width="129.2" height="18" fill="#FFFFFF" rx="3"/>
<text x="255" y="285" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D93025" text-anchor="middle">UPDATE available = 0</text>
<rect x="420.4" y="318" width="129.2" height="18" fill="#FFFFFF" rx="3"/>
<text x="485" y="330" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D93025" text-anchor="middle">UPDATE available = 0</text>
<rect x="215.04" y="373" width="79.92" height="18" fill="#FFFFFF" rx="3"/>
<text x="255" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1E8E3E" text-anchor="middle">order placed</text>
<rect x="445.04" y="373" width="79.92" height="18" fill="#FFFFFF" rx="3"/>
<text x="485" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1E8E3E" text-anchor="middle">order placed</text>
<text x="370" y="474" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">2 orders, 1 unit. Someone gets a "sorry" email.</text>
<text x="370" y="488" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="middle">Raising the isolation level to SERIALIZABLE fixes it</text>
<text x="370" y="500" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="middle">but aborts and retries under load.</text>
<text x="900" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Shopper A</text>
<text x="1130" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">stock row sku-123</text>
<text x="1360" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Shopper B</text>
<rect x="894.96" y="173" width="240.08" height="18" fill="#FFFFFF" rx="3"/>
<text x="1015" y="185" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1E8E3E" text-anchor="middle">UPDATE … WHERE on_hand - reserved &gt;= 1</text>
<rect x="965.8" y="218" width="98.4" height="18" fill="#FFFFFF" rx="3"/>
<text x="1015" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1E8E3E" text-anchor="middle">1 row: reserved</text>
<rect x="1146.52" y="273" width="196.96" height="18" fill="#FFFFFF" rx="3"/>
<text x="1245" y="285" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1A73E8" text-anchor="middle">same UPDATE (waits on row lock)</text>
<rect x="1192.72" y="318" width="104.56" height="18" fill="#FFFFFF" rx="3"/>
<text x="1245" y="330" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#E8710A" text-anchor="middle">0 rows: sold out</text>
<text x="812" y="397" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#202124" text-anchor="start">BEGIN;</text>
<text x="812" y="414" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#202124" text-anchor="start">UPDATE stock SET reserved = reserved + :qty</text>
<text x="812" y="431" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#202124" text-anchor="start"> WHERE sku = :sku AND on_hand - reserved &gt;= :qty;</text>
<text x="812" y="448" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5F6368" text-anchor="start">-- 0 rows? ROLLBACK, tell the shopper it sold out</text>
<text x="812" y="465" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#202124" text-anchor="start">INSERT INTO reservations (id, sku, qty, checkout_id, expires_at)</text>
<text x="812" y="482" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#202124" text-anchor="start"> VALUES (:id, :sku, :qty, :ck, now() + interval '15 min');</text>
<text x="812" y="499" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#202124" text-anchor="start">COMMIT;</text>
<text x="135" y="677.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Available</text>
<text x="135" y="691.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="middle">on_hand - reserved</text>
<text x="440" y="677.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">HELD</text>
<text x="440" y="691.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="middle">expires_at = now() + 15 min</text>
<text x="830" y="627.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">COMMITTED</text>
<text x="830" y="641.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="middle">on_hand -= qty, reserved -= qty</text>
<text x="1200" y="627.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">SHIPPED</text>
<text x="1200" y="641.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="middle">pick, pack, capture payment</text>
<text x="830" y="725.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">RELEASED</text>
<text x="830" y="739.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="middle">reserved -= qty</text>
<text x="830" y="815.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">EXPIRED</text>
<text x="830" y="829.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="middle">reserved -= qty</text>
<rect x="222.72" y="654" width="104.56" height="18" fill="#FFFFFF" rx="3"/>
<text x="275" y="666" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#E8710A" text-anchor="middle">reserve (step 2)</text>
<rect x="538.08" y="584" width="153.84" height="18" fill="#FFFFFF" rx="3"/>
<text x="615" y="596" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1E8E3E" text-anchor="middle">order confirmed (step 5)</text>
<rect x="568.48" y="704" width="123.04" height="18" fill="#FFFFFF" rx="3"/>
<text x="630" y="716" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D93025" text-anchor="middle">payment failed (C2)</text>
<rect x="342" y="759" width="227.76" height="33" fill="#FFFFFF" rx="3"/>
<text x="345" y="771" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D93025" text-anchor="start">sweeper, every minute:</text>
<text x="345" y="786" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D93025" text-anchor="start">expires_at &lt; now() AND status = HELD</text>
<rect x="1007" y="769" width="160" height="18" fill="#FFFFFF" rx="3"/>
<text x="1010" y="781" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5F6368" text-anchor="start">stock returns to the pool</text>
<text x="1210" y="702" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124" text-anchor="start">Release and expiry both use</text>
<text x="1210" y="718" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124" text-anchor="start">WHERE status = 'HELD', so</text>
<text x="1210" y="734" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124" text-anchor="start">they can race safely: only one</text>
<text x="1210" y="750" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124" text-anchor="start">of them changes the row.</text></svg>
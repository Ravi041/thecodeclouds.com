<path d="M1360 300 L1130 300" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#a1A73E8)"/>
<path d="M1130 245 L900 245" fill="none" stroke="#1E8E3E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a1E8E3E)"/>
<path d="M900 200 L1130 200" fill="none" stroke="#1E8E3E" stroke-width="2" marker-end="url(#a1E8E3E)"/>

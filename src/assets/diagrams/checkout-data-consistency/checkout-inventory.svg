<path d="M1130 161 L1130 365" fill="none" stroke="#BDC1C6" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M900 161 L900 365" fill="none" stroke="#BDC1C6" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M370 400 L600 400" fill="none" stroke="#1E8E3E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a1E8E3E)"/>
<path d="M370 400 L140 400" fill="none" stroke="#1E8E3E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a1E8E3E)"/>

<path d="M550 668 L700 630" fill="none" stroke="#1E8E3E" stroke-width="2" marker-end="url(#a1E8E3E)"/>
<path d="M220 680 L330 680" fill="none" stroke="#E8710A" stroke-width="2" marker-end="url(#aE8710A)"/>

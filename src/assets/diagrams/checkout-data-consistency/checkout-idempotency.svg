<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img"><title>3. Idempotent payment on retry</title><defs><marker id="a1A73E8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1A73E8"/></marker><marker id="a1E8E3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E8E3E"/></marker><marker id="a5F6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F6368"/></marker><marker id="a8430CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8430CE"/></marker><marker id="aBDC1C6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#BDC1C6"/></marker><marker id="aD93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D93025"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="15" y="80" width="190" height="50" rx="8" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/>
<rect x="325" y="80" width="190" height="50" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
<rect x="635" y="80" width="190" height="50" rx="8" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.5"/>
<rect x="945" y="80" width="190" height="50" rx="8" fill="#F3E8FD" stroke="#8430CE" stroke-width="1.5"/>
<rect x="950" y="690" width="180" height="56" rx="8" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.5"/>
<rect x="1200" y="80" width="280" height="330" rx="8" fill="#FFFFFF" stroke="#202124"/>
<text x="1208" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="start">What the key row decides</text>
<rect x="1200" y="430" width="280" height="210" rx="8" fill="#FFFFFF" stroke="#1E8E3E"/>
<text x="1208" y="446" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E8E3E" text-anchor="start">Table</text>
<rect x="1200" y="660" width="280" height="140" rx="8" fill="#FFFFFF" stroke="#1A73E8"/>
<text x="1208" y="676" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A73E8" text-anchor="start">Who makes the key?</text>
<path d="M420 810 L110 810" fill="none" stroke="#1A73E8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a1A73E8)"/>
<path d="M730 750 L420 750" fill="none" stroke="#1E8E3E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a1E8E3E)"/>
<path d="M420 700 L730 700" fill="none" stroke="#1E8E3E" stroke-width="2" marker-end="url(#a1E8E3E)"/>
<path d="M110 640 L420 640" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#a1A73E8)"/>
<path d="M20 570 L1180 570" fill="none" stroke="#5F6368" stroke-width="1"/>
<path d="M420 520 L265 520" fill="none" stroke="#D93025" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M420 470 L730 470" fill="none" stroke="#1E8E3E" stroke-width="2" marker-end="url(#a1E8E3E)"/>
<path d="M1040 410 L420 410" fill="none" stroke="#8430CE" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a8430CE)"/>
<path d="M420 360 L1040 360" fill="none" stroke="#8430CE" stroke-width="2" marker-end="url(#a8430CE)"/>
<path d="M730 300 L420 300" fill="none" stroke="#1E8E3E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a1E8E3E)"/>
<path d="M420 250 L730 250" fill="none" stroke="#1E8E3E" stroke-width="2" marker-end="url(#a1E8E3E)"/>
<path d="M110 190 L420 190" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#a1A73E8)"/>
<path d="M1040 130 L1040 860" fill="none" stroke="#BDC1C6" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M730 130 L730 860" fill="none" stroke="#BDC1C6" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M420 130 L420 860" fill="none" stroke="#BDC1C6" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M110 130 L110 860" fill="none" stroke="#BDC1C6" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="20" y="34" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#232F3E" text-anchor="start">Scenario: the shopper taps Pay, the network drops the response, the app retries</text>
<text x="20" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F6368" text-anchor="start">Without a key this is two charges. With one, the retry gets the first answer back and the PSP is never called twice.</text>
<text x="110" y="109" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Shopper app</text>
<text x="420" y="109" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Payment service</text>
<text x="730" y="102.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Payments DB</text>
<text x="730" y="116.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="middle">idempotency_keys</text>
<text x="1040" y="109" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">Payment gateway (PSP)</text>
<text x="20" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="start">Attempt 1</text>
<rect x="117.24" y="157" width="295.52" height="18" fill="#FFFFFF" rx="3"/>
<text x="265" y="169" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1A73E8" text-anchor="middle">POST /payments  Idempotency-Key: 7f3c-…  £79.99</text>
<rect x="448.8" y="217" width="252.4" height="18" fill="#FFFFFF" rx="3"/>
<text x="575" y="229" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1E8E3E" text-anchor="middle">INSERT key, request_hash, status=STARTED</text>
<rect x="491.92" y="267" width="166.16" height="18" fill="#FFFFFF" rx="3"/>
<text x="575" y="279" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1E8E3E" text-anchor="middle">inserted (we own this key)</text>
<rect x="603.8" y="327" width="252.4" height="18" fill="#FFFFFF" rx="3"/>
<text x="730" y="339" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8430CE" text-anchor="middle">authorize £79.99, idempotency key 7f3c-…</text>
<rect x="646.92" y="377" width="166.16" height="18" fill="#FFFFFF" rx="3"/>
<text x="730" y="389" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8430CE" text-anchor="middle">AUTHORIZED, auth_id pi_91X</text>
<rect x="464.2" y="437" width="221.6" height="18" fill="#FFFFFF" rx="3"/>
<text x="575" y="449" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1E8E3E" text-anchor="middle">UPDATE status=SUCCEEDED, response=…</text>
<text x="257" y="527" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#D93025" text-anchor="start">✕</text>
<rect x="108" y="525" width="314" height="18" fill="#FFFFFF" rx="3"/>
<text x="265" y="537" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D93025" text-anchor="middle">201 Created (lost: tunnel, app killed, LB timeout)</text>
<text x="20" y="592" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="start">Attempt 2 (app retries 3 s later with the SAME key)</text>
<rect x="117.24" y="607" width="295.52" height="18" fill="#FFFFFF" rx="3"/>
<text x="265" y="619" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1A73E8" text-anchor="middle">POST /payments  Idempotency-Key: 7f3c-…  £79.99</text>
<rect x="448.8" y="667" width="252.4" height="18" fill="#FFFFFF" rx="3"/>
<text x="575" y="679" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1E8E3E" text-anchor="middle">INSERT … ON CONFLICT DO NOTHING → 0 rows</text>
<rect x="442.64" y="717" width="264.72" height="18" fill="#FFFFFF" rx="3"/>
<text x="575" y="729" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1E8E3E" text-anchor="middle">existing row: SUCCEEDED, same request_hash</text>
<rect x="144.96" y="777" width="240.08" height="18" fill="#FFFFFF" rx="3"/>
<text x="265" y="789" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1A73E8" text-anchor="middle">201 Created (stored response replayed)</text>
<rect x="854.52" y="439" width="178.48" height="33" fill="#FFFFFF" rx="3"/>
<text x="1030" y="451" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8430CE" text-anchor="end">PSP also dedupes on the key,</text>
<text x="1030" y="466" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8430CE" text-anchor="end">in case WE retry</text>
<text x="1040" y="715.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="middle">PSP not called.</text>
<text x="1040" y="729.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="middle">One charge.</text>
<text x="1215" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E8710A" text-anchor="start">STARTED, under 30 s old</text>
<text x="1215" y="147" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5F6368" text-anchor="start">409, "still processing,</text>
<text x="1215" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5F6368" text-anchor="start">retry in 1 s"</text>
<text x="1215" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E8710A" text-anchor="start">STARTED, stale</text>
<text x="1215" y="219" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5F6368" text-anchor="start">take over: ask PSP</text>
<text x="1215" y="234" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5F6368" text-anchor="start">for key 7f3c-… first</text>
<text x="1215" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E8E3E" text-anchor="start">SUCCEEDED / FAILED</text>
<text x="1215" y="291" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5F6368" text-anchor="start">replay stored</text>
<text x="1215" y="306" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5F6368" text-anchor="start">response as is</text>
<text x="1215" y="344" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#D93025" text-anchor="start">same key, different body</text>
<text x="1215" y="363" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5F6368" text-anchor="start">422, key reuse</text>
<text x="1215" y="378" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5F6368" text-anchor="start">is a client bug</text>
<text x="1212" y="468" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#202124" text-anchor="start">CREATE TABLE idempotency_keys (</text>
<text x="1212" y="487" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#202124" text-anchor="start">   key text PRIMARY KEY,</text>
<text x="1212" y="506" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#202124" text-anchor="start">   merchant_id bigint NOT NULL,</text>
<text x="1212" y="525" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#202124" text-anchor="start">   request_hash bytea NOT NULL,</text>
<text x="1212" y="544" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#202124" text-anchor="start">   status text NOT NULL,</text>
<text x="1212" y="563" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#202124" text-anchor="start">   response jsonb,</text>
<text x="1212" y="582" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#202124" text-anchor="start">   locked_at timestamptz,</text>
<text x="1212" y="601" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#202124" text-anchor="start">   created_at timestamptz DEFAULT now()</text>
<text x="1212" y="620" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#202124" text-anchor="start">); -- keep 24 to 72 h, then purge</text>
<text x="1212" y="702" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124" text-anchor="start">The client, once per checkout</text>
<text x="1212" y="718" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124" text-anchor="start">attempt, before the first tap.</text>
<text x="1212" y="734" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124" text-anchor="start">Stored with the cart so a reload</text>
<text x="1212" y="750" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124" text-anchor="start">reuses it. A new key means</text>
<text x="1212" y="766" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124" text-anchor="start">"I really want to pay again".</text></svg>
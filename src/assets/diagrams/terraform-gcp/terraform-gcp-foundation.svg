<text x="676" y="160" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">GCS state bucket (versioned, public access prevention) · sa-tf-* service accounts</text>
<text x="676" y="177" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">Workload Identity pool + provider for CI</text>

<text x="20" y="32" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#202124" text-anchor="start">Search: keep the index fresh without letting it decide price or stock</text>
<text x="20" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F6368" text-anchor="start">Writes go through an outbox and a stream, so the index catches up in seconds and can always be rebuilt from scratch.</text>
<text x="30" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="start">Catalog service</text>
<text x="30" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">seller edits a product</text>
<text x="30" y="160" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">or a price</text>
<text x="281" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="start">Primary database</text>
<text x="281" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">products + outbox row</text>
<text x="281" y="160" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">in one transaction</text>
<text x="532" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="start">CDC connector</text>
<text x="532" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">tails the outbox,</text>
<text x="532" y="160" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">at-least-once</text>
<text x="783" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="start">Event stream</text>
<text x="783" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">product-changes,</text>
<text x="783" y="160" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">key = product id</text>
<text x="1034" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="start">Indexer workers</text>
<text x="1034" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">bulk 1,000 docs or 1 s,</text>
<text x="1034" y="160" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">skip older versions</text>
<text x="1285" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="start">Search cluster</text>
<text x="1285" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">products_v7 behind</text>
<text x="1285" y="160" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">read + write aliases</text>
<circle cx="250" cy="151" r="11" fill="#1E8E3E"/><text x="250" y="155.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="501" cy="151" r="11" fill="#1E8E3E"/><text x="501" y="155.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="752" cy="151" r="11" fill="#1E8E3E"/><text x="752" y="155.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="1003" cy="151" r="11" fill="#1E8E3E"/><text x="1003" y="155.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<circle cx="1254" cy="151" r="11" fill="#1E8E3E"/><text x="1254" y="155.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="30" y="360" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="start">Shopper</text>
<text x="30" y="376" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">searches "ps5 console"</text>
<text x="532" y="360" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="start">Search service</text>
<text x="532" y="376" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">query + facets,</text>
<text x="532" y="390" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">returns product ids</text>
<text x="1034" y="360" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#202124" text-anchor="start">Redis cache</text>
<text x="1034" y="376" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">MGET price + stock</text>
<text x="1034" y="390" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5F6368" text-anchor="start">for the 24 ids on screen</text>
<text x="640" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1A73E8" text-anchor="start">query the read alias "products"</text>
<text x="880" y="361" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1A73E8" text-anchor="middle">hydrate the live fields</text>
<circle cx="371" cy="382" r="11" fill="#1A73E8"/><text x="371" y="386.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<circle cx="1011" cy="280" r="11" fill="#1A73E8"/><text x="1011" y="284.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
<circle cx="871" cy="382" r="11" fill="#1A73E8"/><text x="871" y="386.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="20" y="468" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">Write path (green): 1 seller saves, 2 outbox row commits with the change, 3 CDC publishes it, 4 ordered per product, 5 bulk indexed.</text>
<text x="20" y="484" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3C4043" text-anchor="start">Read path (blue): 6 query arrives, 7 search returns ids and facets, 8 price and stock come from the cache, not the index.</text>
<text x="34" y="543" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#E37400" text-anchor="start">Measure lag, do not guess it</text>
<text x="34" y="565" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Every event carries updated_at from the database.</text>
<text x="34" y="580" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">The indexer publishes now - updated_at as a metric.</text>
<text x="34" y="595" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Normal: 1-3 s. Alert at 30 s, page at 5 min.</text>
<text x="34" y="610" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Also watch consumer lag on the stream: if it</text>
<text x="34" y="625" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">grows while workers are healthy, add partitions</text>
<text x="34" y="640" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">or bulk size, not more retries.</text>
<text x="534" y="543" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#8430CE" text-anchor="start">Reindex with zero downtime</text>
<text x="534" y="565" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">1  Create products_v8 with the new mapping.</text>
<text x="534" y="580" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">2  Point the write alias at both v7 and v8,</text>
<text x="534" y="595" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">    or replay the stream from a snapshot offset.</text>
<text x="534" y="610" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">3  Backfill v8 from the database.</text>
<text x="534" y="625" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">4  Compare counts and run saved queries.</text>
<text x="534" y="640" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">5  Swap the read alias in one atomic call.</text>
<text x="534" y="655" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">6  Keep v7 for a day, then delete it.</text>
<text x="1034" y="543" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A73E8" text-anchor="start">Read your own writes</text>
<text x="1034" y="565" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">A seller changes a price and searches for it at</text>
<text x="1034" y="580" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">once. The index is 2 s behind, so they see the</text>
<text x="1034" y="595" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">old price and open a ticket.</text>
<text x="1034" y="610" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">Fix: for 60 s after a seller edit, show that</text>
<text x="1034" y="625" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">seller their products from the database, and</text>
<text x="1034" y="640" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">show shoppers price from the cache, which the</text>
<text x="1034" y="655" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#3C4043" text-anchor="start">write path updates directly.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" width="1500" height="860" role="img"><title>3. Cache stampede</title><defs><marker id="a1E8E3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E8E3E"/></marker><marker id="a5F6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F6368"/></marker><marker id="aD93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D93025"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="20" y="70" width="700" height="560" rx="8" fill="#FFF8F7" stroke="#D93025"/>
<text x="28" y="86" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#D93025" text-anchor="start">Before: plain cache-aside, fixed TTL</text>
<rect x="780" y="70" width="700" height="560" rx="8" fill="#F6FBF7" stroke="#1E8E3E"/>
<text x="788" y="86" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E8E3E" text-anchor="start">After: soft TTL, one rebuilder, everyone else served stale</text>
<rect x="200" y="110" width="340" height="64" rx="8" fill="#FFFFFF" stroke="#5F6368"/>
<text x="208" y="126" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C4043" text-anchor="start"></text>
<rect x="200" y="220" width="340" height="64" rx="8" fill="#FFFFFF" stroke="#1A73E8"/>
<text x="208" y="236" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C4043" text-anchor="start"></text>
